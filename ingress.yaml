# BEFORE DEPLOYING:
# 1. Replace <ACM_CERTIFICATE_ARN> with your ACM certificate ARN for awswithavinashreddy.com
#    Get it from: aws acm list-certificates --region ap-south-1
# 2. Ensure your Route53 hosted zone exists for awswithavinashreddy.com
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-management-ingress
  namespace: task-management
  annotations:
    # ALB Configuration
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
    alb.ingress.kubernetes.io/load-balancer-name: task-management-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/success-codes: "200,404"
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb
  rules:
   - http:
      paths:
       - path: /api/auth
         pathType: Prefix
         backend:
          service:
            name: user-service
            port:
              number: 3001
       - path: /api/users
         pathType: Prefix
         backend:
          service:
            name: user-service
            port:
              number: 3001
       - path: /api/tasks
         pathType: Prefix
         backend:
          service:
            name: task-service
            port:
              number: 3002
       - path: /api/notifications
         pathType: Prefix
         backend:
          service:
            name: notification-service
            port:
              number: 3003
       - path: /api/analytics
         pathType: Prefix
         backend:
          service:
            name: analytics-service
            port:
              number: 3004
       - path: /
         pathType: Prefix
         backend:
          service:
            name: frontend-service
            port:
              number: 80
